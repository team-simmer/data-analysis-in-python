# Published as .github/workflows/workbook-tests.yml in team-simmer/data-analysis-in-python.
# Runs every workbook's tests (tests/run_tests.py): the solution and the common mistakes, in a real
# IPython kernel, on Colab's Python, with the pandas versions the course must work on:
# - 2.2.3: Colab's default when the course was written (DA workbooks run Colab's default pandas)
# - 3.0.2: the code editor's pandas, and where Colab is heading
# - latest: to hear about the next pandas before Colab ships it
# The course code must behave the same on all of them (see the outline's notes on the pandas version).
# openpyxl is pinned to Colab's version (3.1.5): lesson 4. writes and reads Excel files with it.
# matplotlib, seaborn and Plotly are pinned to Colab's versions (3.10.0, 0.13.2, 5.24.1): lesson 8. checks charts
# through their objects, so a new version that draws differently would change what the checks read.
# nbformat is preinstalled in Colab, and Plotly's fig.show() needs it in a kernel.
# SciPy and statsmodels are pinned to Colab's versions (1.16.3, 0.15.0): lesson 9.'s checks compare p-values,
# intervals and sample sizes to six decimals, so a version that changes a default would change what they read.
# scikit-learn is pinned to Colab's version (1.6.1): lesson 11.'s checks compare k-means inertias and silhouette scores,
# which a new version's defaults could change.
# The source is in courses/data-analysis-in-python/tools/ in the course repo.
name: Workbook tests

on:
  push:
    branches: [main]
  schedule:
    # Every Monday, to notice a new pandas, or a change in the data store, before students do
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  workbooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pandas: ["2.2.3", "3.0.2", "latest"]
    name: pandas ${{ matrix.pandas }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes full versions only, no v10 tag
        with:
          # No lockfile to key a cache on, and uv resolves pandas fresh for each version anyway
          enable-cache: false
      - name: Run the workbook tests
        shell: bash
        run: |
          if [ "${{ matrix.pandas }}" = "latest" ]; then spec="pandas"; else spec="pandas==${{ matrix.pandas }}"; fi
          uv run --python 3.13 --with "$spec" --with pyarrow --with openpyxl==3.1.5 \
            --with matplotlib==3.10.0 --with seaborn==0.13.2 --with plotly==5.24.1 --with nbformat --with scipy==1.16.3 --with statsmodels==0.15.0 --with scikit-learn==1.6.1 --with ipykernel --with jupyter_client \
            tests/run_tests.py 2>&1 | tee output.txt
          {
            echo "## pandas ${{ matrix.pandas }}"; echo
            echo '```text'; grep -E "^(Python|## |PASS|FAIL|[0-9]+ failed)" output.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
